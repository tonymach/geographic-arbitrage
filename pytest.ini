[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Integration tests (run with -m integration)
    slow: Slow tests (run with -m slow)
    asyncio: Async tests
addopts = 
    -v
    --tb=short
    --strict-markers
asyncio_mode = auto
