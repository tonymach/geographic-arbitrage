# Software categories to track
categories:
  - "Project Management"
  - "CRM & Sales"
  - "Accounting & Finance"
  - "HR & Payroll"
  - "Legal Tech"
  - "Construction Management"
  - "Real Estate Management"
  - "Manufacturing & Supply Chain"
  - "Healthcare Management"
  - "Education & Learning Management"
  - "Coworking & Space Management"
  - "Agriculture & Farm Management"
  - "Logistics & Maritime"
  - "Hospitality & Hotel Management"
  - "Retail & E-commerce"
  - "Marketing Automation"
  - "Customer Support & Helpdesk"
  - "Cybersecurity"
  - "DevOps & Development Tools"
  - "Business Intelligence & Analytics"
  - "Document Management"
  - "Workflow Automation"
  - "Event Management"
  - "Fleet Management"
  - "Inventory Management"

# Gap detection thresholds
gap_detection:
  min_source_reviews: 100  # Minimum reviews in source region to consider
  min_gap_score: 6.0  # Minimum gap score (0-10) to flag as opportunity
  max_target_competition_level: 3  # Max number of strong competitors in target

  # Scoring weights
  weights:
    review_count_gap: 0.25
    rating_difference: 0.15
    competition_gap: 0.30
    market_size: 0.20
    digitalization_lag: 0.10

# Validation settings
validation:
  contract_validation:
    enabled: true
    min_contract_value: 10000  # Minimum contract value to consider (USD)
    max_contract_age_days: 730  # Only consider contracts from last 2 years

  pain_signal_validation:
    enabled: true
    sources:
      - reddit
      - indie_hackers
      - hacker_news
      - regional_forums
    min_mentions: 5  # Minimum pain mentions to validate

  company_need_validation:
    enabled: true
    min_companies_in_vertical: 10  # Min companies in vertical to validate need

# Rate limiting
rate_limiting:
  requests_per_minute: 30
  requests_per_hour: 1000
  backoff_strategy: "exponential"
  max_retries: 3

# Database settings
database:
  type: "sqlite"
  path: "data/arbitrage.db"
  backup_enabled: true
  backup_frequency: "daily"

# Logging
logging:
  level: "INFO"
  file: "logs/arbitrage.log"
  max_size_mb: 100
  backup_count: 5

# Parallel execution
execution:
  max_parallel_regions: 5
  max_parallel_scrapers: 10
  timeout_seconds: 300

# Test mode (start with small subset)
test_mode:
  enabled: true
  # Global business arbitrage set - diverse digitalization stages
  test_regions:
    # Mature markets (source of proven software)
    - United States
    - United Kingdom
    - Germany

    # Emerging Europe (lag opportunities)
    - Poland
    - Romania
    - Czech Republic

    # Fast-growing Asia
    - Singapore
    - South Korea
    - Japan

    # High-potential markets
    - India
    - Thailand
    - Indonesia

  max_companies_per_region: 100
  max_products_per_category: 30
