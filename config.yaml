# Global Software Arbitrage Configuration

regions:
  north_america:
    - United States
    - Canada

  western_europe:
    - United Kingdom
    - Germany
    - France
    - Netherlands
    - Spain
    - Italy
    - Ireland
    - Switzerland
    - Belgium
    - Austria

  eastern_europe:
    - Romania
    - Poland
    - Czech Republic
    - Hungary
    - Bulgaria
    - Croatia
    - Serbia
    - Ukraine
    - Slovakia
    - Slovenia

  asia:
    - Singapore
    - Japan
    - South Korea
    - Hong Kong
    - Taiwan
    - Thailand
    - Vietnam
    - Indonesia
    - India
    - Malaysia
    - Philippines

  oceania:
    - Australia
    - New Zealand

# Phase 0: Platform Discovery Settings
platform_discovery:
  enabled: true
  max_platforms_per_region: 15
  min_platforms_per_region: 3

  required_validation_checks:
    - active_content  # Has recent content/activity
    - scrapeable_structure  # Can be scraped
    - relevant_data  # Contains software/company data
    - sufficient_size  # Minimum traffic/content threshold

  # Known global platforms to seed with
  seed_platforms:
    global:
      - name: "G2"
        url: "https://www.g2.com"
        type: "software_reviews"
        language: "English"
      - name: "Capterra"
        url: "https://www.capterra.com"
        type: "software_reviews"
        language: "English"
      - name: "Product Hunt"
        url: "https://www.producthunt.com"
        type: "product_directory"
        language: "English"
      - name: "AlternativeTo"
        url: "https://alternativeto.net"
        type: "software_alternatives"
        language: "English"
      - name: "Trustpilot"
        url: "https://www.trustpilot.com"
        type: "business_reviews"
        language: "English"

    # Known regional platforms (discovered platforms will be added here)
    regional:
      japan:
        - name: "ITreview"
          url: "https://www.itreview.jp"
          type: "software_reviews"
          language: "Japanese"
        - name: "Boxil"
          url: "https://boxil.jp"
          type: "saas_comparison"
          language: "Japanese"

      germany:
        - name: "OMR Reviews"
          url: "https://www.omr.com/en/reviews"
          type: "software_reviews"
          language: "German/English"

      france:
        - name: "Appvizer"
          url: "https://www.appvizer.fr"
          type: "software_comparison"
          language: "French"

      romania:
        - name: "Lista Firmelor"
          url: "https://www.listafirme.ro"
          type: "business_directory"
          language: "Romanian"

  # Language support
  language_support:
    - English
    - Spanish
    - French
    - German
    - Polish
    - Romanian
    - Japanese
    - Korean
    - Chinese (Simplified)
    - Chinese (Traditional)
    - Dutch
    - Czech
    - Portuguese
    - Italian
    - Russian
    - Hungarian
    - Thai
    - Vietnamese
    - Indonesian
    - Malay

# Scraper generation settings
scraper_generation:
  auto_generate: true  # Let Claude create scrapers for new platforms
  fallback_to_manual: true
  test_before_use: true
  save_generated_scrapers: true
  max_retries: 3

# Data source priorities
company_data_sources:
  - crunchbase
  - linkedin
  - local_rankings
  - stock_exchanges
  - tech_media
  - builtwith
  - job_boards
  - local_platforms  # Discovered platforms

software_data_sources:
  - g2
  - capterra
  - producthunt
  - alternativeto
  - trustpilot
  - tech_stack_detectors
  - local_platforms  # Critical: discovered platforms

